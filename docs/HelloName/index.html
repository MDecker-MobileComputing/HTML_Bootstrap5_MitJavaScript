<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Hello Name</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
    </head>
    <body>

        <div class="container-sm my-3">

            <h1 class="text-center mt-3 mb-5">Hello Name (Bootstrap 5)</h1>


            <div class="row g-3">
                <div class="col-md-6">
                    <label for="inputFirstName" class="form-label fs-4">First name</label>
                    <input id="inputFirstName" type="text" class="form-control form-control-lg">
                </div>
                <div class="col-md-6">
                    <label for="inputLastName" class="form-label fs-4">Last name</label>
                    <input id="inputLastName" type="text" class="form-control form-control-lg">
                </div>
                <div class="col-12">
                    <button id="buttonGreet" class="btn btn-primary">Greet me!</button>
                    <button id="buttonReset" class="btn btn-secondary">Reset</button>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script src="./hello-name.js"></script>

    </body>
</html>
